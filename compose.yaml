services:
  lambda:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-lambdadocker:local
    ports:
      - "9000:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-lambdadocker:local
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["fastapi_lambdadocker:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
