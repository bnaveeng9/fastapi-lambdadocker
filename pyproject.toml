[project]
name = "fastapi-lambdadocker"
version = "0.1.0"
description = "FastAPI app packaged for local and Lambda/Docker startup"
readme = "README.md"
authors = [
    { name = "bnaveeng9", email = "naveeng9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.3",
    "mangum>=0.22.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-lambdadocker = "fastapi_lambdadocker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
