[project]
name = "fastapi-lambdadocker"
version = "0.1.0"
description = "FastAPI app packaged for local and Lambda/Docker startup"
readme = "README.md"
authors = [
    { name = "bnaveeng9", email = "naveeng9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "fastmcp",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "google[oauth2]>=3.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mangum>=0.22.0",
    "names>=0.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-lambdadocker = "fastapi_lambdadocker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
